name: Flappy Bird regression tests

on:
  pull_request:
    paths:
      - 'src/tools/flappy_bird/**'
      - 'src/tools/shared/**'
      - 'src/resources/**'
      - 'tests/flappy-bird.spec.js'
      - 'tests/helpers/flappy-bird.js'
      - 'playwright.config.js'
      - 'package*.json'
      - '.github/workflows/flappy-bird-tests.yml'
  push:
    branches: [master]
    paths:
      - 'src/tools/flappy_bird/**'
      - 'tests/flappy-bird.spec.js'
      - 'tests/helpers/flappy-bird.js'
      - '.github/workflows/flappy-bird-tests.yml'

jobs:
  flight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/flappy-bird.spec.js
