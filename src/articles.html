<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <script id="theme-init">
        (function() {
            if (!/(?:^|;\s*)darkMode=true/.test(document.cookie)) return;
            var root = document.documentElement;
            root.classList.add("dark-mode");
            root.style.colorScheme = "dark";
            root.style.backgroundColor = "#0d1117";
            new MutationObserver(function(changes, observer) {
                if (document.body) {
                    document.body.classList.add("dark-mode");
                    observer.disconnect();
                }
            }).observe(root, {
                childList: true
            });
        })();
    </script>
    <meta http-equiv="refresh" content="0;url=articles/blog_1.html">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://adamdjellouli.com/articles/blog_1">
    <title>Articles</title>
    <style>
        html.dark-mode {
            background: #0d1117;
            color: #e6edf3;
        }
    </style>
</head>

<body>
    <p>Moved to <a href="articles/blog_1.html">Articles</a>.</p>
</body>

</html>
